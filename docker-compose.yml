services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aamish
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aamish"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/aamish}
      SESSION_SECRET: ${SESSION_SECRET:-local-development-secret-change-before-deploy}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      TZ: Asia/Dhaka
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
